vulnerabilities:
  - id: CVE-2026-14257
    expired_at: 2026-10-31
    statement: >-
      Temporary exception for brace-expansion 1.1.16 and 2.1.2, pulled into the
      API runtime image transitively by exceljs 4.4.0 through archiver, glob,
      minimatch, and readdir-glob. Acropora OS does not expose user-controlled
      brace or glob patterns to these dependencies. Remove this exception when
      ExcelJS or its archive dependency chain adopts a compatible patched
      brace-expansion release.
  - id: CVE-2026-40345
    expired_at: 2026-10-31
    statement: >-
      Temporary exception for deepmerge-ts 7.1.5, pulled into the API runtime
      image transitively by the Prisma CLI: prisma 6.19.3 depends on
      @prisma/config 6.19.3, which depends on deepmerge-ts. No workspace
      package declares either one, and no file under apps/ or packages/
      imports @prisma/config or deepmerge-ts. The vulnerability is stack
      exhaustion when merging deeply recursive structures, so it needs
      attacker-controlled input reaching that merge. In this image the merge
      runs once at container start, when docker-entrypoint.sh invokes
      `prisma migrate deploy` and @prisma/config loads the committed
      packages/database/prisma.config.ts together with the environment; both
      are operator-controlled. The NestJS request path uses @prisma/client,
      which does not depend on @prisma/config at all. Remove this exception
      when Prisma ships a @prisma/config release that depends on deepmerge-ts
      8.0.0 or newer. A pnpm override forcing 8.0.0 under the current
      @prisma/config was considered and rejected: a major bump underneath
      Prisma's own config loader would put migrations and client generation
      at risk for a vulnerability nothing here can reach.
