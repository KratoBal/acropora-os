name: Temporary Prettier capture

on:
  push:
    branches:
      - tmp/prettier-figma-map-os

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format target files
        run: npx --yes prettier@3.9.5 --write docs/FIGMA-MAP.md scripts/figma-map-check.mjs
      - name: Emit formatted files
        shell: bash
        run: |
          echo "BEGIN_FIGMA_MAP_BASE64"
          base64 -w0 docs/FIGMA-MAP.md
          echo
          echo "END_FIGMA_MAP_BASE64"
          echo "BEGIN_VALIDATOR_BASE64"
          base64 -w0 scripts/figma-map-check.mjs
          echo
          echo "END_VALIDATOR_BASE64"
