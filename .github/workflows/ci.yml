name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://acropora:acropora@localhost:5432/acropora_ci?schema=public
  REDIS_URL: redis://localhost:6379
  API_URL: http://127.0.0.1:3001

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acropora_ci
          POSTGRES_USER: acropora
          POSTGRES_PASSWORD: acropora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acropora -d acropora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Deploy migrations to empty PostgreSQL
        run: pnpm prisma:deploy

      - name: Seed development reference data
        run: pnpm prisma:seed

      # `pnpm lint` is gone, and not only from this file. In all six
      # workspace packages `lint` was `tsc --noEmit` - the very command
      # `pnpm typecheck` runs - so the job did the work twice, and the two
      # names promised two checks while one happened. Mobile's ESLint is the
      # only real linter in the repository and it is NOT reachable that way:
      # `pnpm-workspace.yaml` excludes `apps/mobile` from the workspace, so
      # `turbo run lint` never included it. `pnpm mobile:lint` below is how it
      # runs, and how it always ran.
      # A titok-kereses ELOL all, es nem sorrendi izles: a tobbi kapu egy hibat
      # mutat meg, ez egy VISSZAVONHATATLAN esemenyt elozne meg.
      #
      # Ugyanazt a szkriptet futtatja, mint a pre-commit hook, csak a TELJES
      # fara. A hook kihagyhato es nem mindenhol letezik, tehat ez a hiteles fele.
      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Static verification
        run: |
          pnpm typecheck
          pnpm mobile:lint
          pnpm mobile:typecheck
          pnpm mobile:test
          # The web export is the one mobile gate that reads the bundler's own
          # resolution: #254 fixed a build that failed on `.wasm` while every
          # check stayed green, because nothing here ever ran an export. It can
          # fail - measured on b4229a5: with `apps/mobile/metro.config.js` in
          # place `expo export --platform web` exits 0, and with that file set
          # aside the same command on the same head exits 1 with
          # "Unable to resolve module ./wa-sqlite/wa-sqlite.wasm".
          #
          # WHAT IT DOES NOT PROVE: that the web app WORKS. This only proves the
          # bundle is produced and the asset is emitted. Whether SQLite actually
          # starts in a browser from the exported file is a different measurement
          # and is not guarded here.
          #
          # Cost, measured on the runner over four runs of this branch: the
          # whole step took 67s, 79s, 81s and 84s, against a 30-33s baseline
          # over the last ten main runs. So this line costs roughly 35-55s,
          # typically nearer the top of that range. Two earlier estimates were
          # both too low - ~32s from a developer machine, then ~35-45s from the
          # first two runs - so treat 55s as the working figure, not 35s.
          # (Metro also caches in the system temp dir, so a "cold" run that only
          # clears node_modules/.cache reports ~4s; that is never the CI number.
          # Runners are always cold.)
          #
          # Do NOT read this off the job total: on the run above the job came out
          # at 247s against a 248s baseline, because four unrelated steps happened
          # to be 27s faster. The step-level number is the honest one.
          pnpm mobile:export:web

      # CONTRIBUTING.md calls `pnpm format:check` the authoritative formatting
      # check, and until now nothing ran it: the pre-commit hook is a local
      # signal that `--no-verify` skips and that only exists where somebody
      # ran the install. This is the gate the document already described.
      - name: Formatting
        run: |
          pnpm format:check || {
            echo "::error::Formatting does not match. Fix it locally with: pnpm format" >&2
            exit 1
          }

      - name: Unit and workspace tests
        run: pnpm test

      - name: Capture release evidence start time
        if: always()
        run: |
          echo "RELEASE_EVIDENCE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Database integration tests
        id: db_integration_tests
        # DELIBERATE, AND LOAD-BEARING - the job does NOT stay green on a
        # failure here. "Fail the job if the database integration tests failed"
        # further down re-reads this step's own outcome and exits 1.
        #
        # The tolerance exists so the steps BETWEEN the two can run: the release
        # evidence recorder writes FAILURE just as much as SUCCESS, and stopping
        # here would leave no trace of exactly the run that most needs one. It
        # also lets the second command in this step matter, which an immediate
        # stop on the first would not.
        #
        # This comment is here because a hundred lines separate the two steps,
        # and reading only this one leads to the opposite conclusion - which is
        # what happened on 2026-08-26 before anyone read the outcome data.
        continue-on-error: true
        run: |
          pnpm --filter @acropora/api test:integration
          pnpm --filter @acropora/api test:brands:integration

      # Checkpoint 9: the recorded databaseEngineVersion must be machine-
      # queried from the actual running server, never a hardcoded literal
      # that could silently drift from what the service container is
      # really running (e.g. after bumping the `postgres:16-alpine` image
      # tag above without remembering to update a hardcoded string
      # elsewhere). `psql` ships preinstalled on GitHub's ubuntu-latest
      # runner image. Runs regardless of the integration tests' own
      # outcome (`if: always()`) - the version to RECORD alongside a
      # FAILURE result is just as much "what did we actually run against"
      # as it is for a SUCCESS.
      - name: Query the actual PostgreSQL server version
        id: postgres_version
        if: always()
        run: |
          # Without `pipefail` the exit status of this assignment is `xargs`'s,
          # which succeeds on empty input - so a psql failure would leave
          # `version` empty and this step GREEN. The job would still fail, two
          # steps later, where record-release-evidence rejects the empty value
          # by name. That is late enough that the reader has to walk back to a
          # green step to find the real cause.
          set -euo pipefail
          version=$(PGPASSWORD=acropora psql -h localhost -U acropora -d acropora_ci -tAc "SHOW server_version;" | xargs)
          echo "server version reported by the running container: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Records a checkpoint-7 ReleaseEvidence row (see
      # packages/database/prisma/record-release-evidence.ts and
      # schema.prisma's ReleaseEvidence doc comment) for the real-Postgres
      # advisory-lock concurrency test inside test:integration
      # (unas-order-sync.repository.integration.spec.ts, commit 76d8c80).
      # This is the ONLY place in the codebase that ever writes to this
      # table - there is no HTTP endpoint, and there never should be.
      #
      # IMPORTANT, KNOWN GAP (documented, not fixed in this checkpoint):
      # this writes into the CI job's OWN ephemeral `postgres` service
      # container above - the same one test:integration itself just ran
      # against - which is destroyed when this job ends. That proves the
      # recorder script's mechanics work end-to-end against a real,
      # disposable Postgres in real CI infrastructure, but it does NOT by
      # itself make this evidence visible to a running PRODUCTION
      # instance's /health/inventory/activation-readiness (which queries
      # ITS OWN database). Wiring a genuine CI -> production evidence
      # write (e.g. as an explicit step in an actual release/deploy
      # pipeline, using a production DATABASE_URL secret CI does not
      # currently have) is deliberately left as a documented plan - see
      # docs/INVENTORY-CONSISTENCY.md's "Release evidence" section - since
      # actually wiring it up crosses into production-deploy territory,
      # explicitly out of this checkpoint's scope.
      # Checkpoint 8 hardening: this step is skipped entirely for pull_request
      # runs whose head repository differs from this repository (i.e. a
      # fork). A fork's tests still run (the `verify` job itself has no such
      # guard) and forks still get real pass/fail feedback in the PR - only
      # the ReleaseEvidence *recording* is skipped, because a fork PR's
      # commitSha, while real, was never reviewed/merged here and must never
      # be able to produce a row that could later be mistaken for trustworthy
      # evidence. This is defense-in-depth: today this step only ever writes
      # to CI's own ephemeral database anyway (see the long comment on the
      # "Database integration tests" step above), but the guard is meant to
      # hold unconditionally once a real CI -> production handoff exists
      # (see release-evidence-handoff.yml, added in checkpoint 8).
      - name: Record release evidence (CI's own ephemeral database)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          RELEASE_EVIDENCE_TYPE: INVENTORY_POSTGRES_CONCURRENCY_TEST
          RELEASE_EVIDENCE_STATUS: ${{ steps.db_integration_tests.outcome == 'success' && 'SUCCESS' || 'FAILURE' }}
          RELEASE_EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_EVIDENCE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          # Checkpoint 8: GitHub's own trustworthy context expressions, not
          # anything the job's own commands could override - see
          # record-release-evidence.ts and schema.prisma's ReleaseEvidence
          # doc comments.
          RELEASE_EVIDENCE_REPOSITORY: ${{ github.repository }}
          RELEASE_EVIDENCE_WORKFLOW_NAME: ${{ github.workflow }}
          RELEASE_EVIDENCE_JOB_NAME: ${{ github.job }}
          RELEASE_EVIDENCE_TRIGGER_EVENT: ${{ github.event_name }}
          RELEASE_EVIDENCE_ENVIRONMENT: github-actions-ci
          RELEASE_EVIDENCE_DB_ENGINE: postgres
          RELEASE_EVIDENCE_DB_ENGINE_VERSION: ${{ steps.postgres_version.outputs.version }}
          RELEASE_EVIDENCE_TEST_SUITE: "apps/api test:integration (unas-order-sync.repository.integration.spec.ts)"
        run: |
          export RELEASE_EVIDENCE_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          pnpm --filter @acropora/database release-evidence:record

      - name: Fail the job if the database integration tests failed
        if: steps.db_integration_tests.outcome != 'success'
        run: |
          echo "Database integration tests failed - see the 'Database integration tests' step above." >&2
          exit 1

      - name: Health HTTP smoke test
        run: pnpm --filter @acropora/api test:smoke

      - name: Production build
        run: pnpm build

  docker-build-scan:
    name: Docker build & vulnerability scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Checkpoint 8: bakes the exact commit under test into the api
          # image via the Dockerfile's RELEASE_COMMIT_SHA build ARG (see
          # that file) - so this CI job also exercises the build-time
          # well-formedness check added there, using a real, valid SHA.
          # OS_PATCH_EPOCH: a run's own identity, so the runner stage's package
          # layer is rebuilt on every scan instead of being replayed from the
          # GitHub Actions cache. Measured on 2026-08-27: the same commit
          # (8ea11c7) scanned green in run 33050897056 and red in run
          # 33050893144, a minute apart, because one of them ran the apk step
          # and the other got it CACHED with the older libssl3 still inside.
          # The scan asks a question about NOW; a replayed layer answers about
          # whenever the cache was written. See apps/web/Dockerfile for why the
          # fix is not a pinned package version.
          - app: api
            build_args: |
              RELEASE_COMMIT_SHA=${{ github.sha }}
              OS_PATCH_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
          - app: web
            build_args: |
              API_URL=http://127.0.0.1:3001
              OS_PATCH_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds through every stage the final image depends on (pruner ->
      # builder -> deployed -> runner for api; pruner -> builder -> runner
      # for web), including the "builder" stage that also doubles as the
      # production migration image (see docs/DEPLOYMENT.md, Section 5) —
      # there is no separate build step needed to validate that stage, it's
      # a prerequisite of the default target built here.
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: acropora-${{ matrix.app }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Pinned to a commit SHA rather than a version tag on purpose:
      # aquasecurity/trivy-action (and trivy itself) suffered a real
      # supply-chain compromise in March 2026 — credential-stealing code was
      # injected via imposter commits into every trivy-action tag from
      # 0.0.1 through 0.34.2. Aqua's own post-incident guidance is to pin
      # Actions to an immutable commit SHA, not a mutable tag, going
      # forward. This SHA is v0.36.0's release commit (GitHub-verified
      # signature), the latest release as of this writing.
      #
      # Fixable HIGH and CRITICAL vulnerabilities fail the build. A narrowly
      # scoped, expiring exception may be documented in .trivyignore.yaml.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acropora-${{ matrix.app }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore.yaml

  docker-smoke-test:
    name: Docker runtime smoke test (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build-scan

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acropora_docker_smoke
          POSTGRES_USER: acropora
          POSTGRES_PASSWORD: acropora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acropora -d acropora_docker_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://acropora:acropora@localhost:5432/acropora_docker_smoke?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This is the actual production migration path end to end: build the
      # pre-prune "builder" stage and run `prisma migrate deploy` from it,
      # exactly as documented in docs/COOLIFY.md's pre-deployment command.
      - name: Build migration image (builder stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: builder
          push: false
          load: true
          tags: acropora-api:migrate-ci
          build-args: RELEASE_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Run migrations against the CI database
        run: |
          docker run --rm --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            acropora-api:migrate-ci \
            pnpm --filter @acropora/database exec prisma migrate deploy

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: acropora-api:ci
          build-args: RELEASE_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Checkpoint 8: proves the Dockerfile's RELEASE_COMMIT_SHA build ARG
      # actually lands as a real environment variable in the built image,
      # with the exact value CI passed - without needing an authenticated
      # HTTP call (activation-readiness itself is permission-gated, so a
      # plain curl here couldn't reach it). `docker inspect` reads the
      # image's baked config directly, no running container needed.
      - name: Verify RELEASE_COMMIT_SHA is baked into the image
        run: |
          set -euo pipefail
          baked=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' acropora-api:ci | grep '^RELEASE_COMMIT_SHA=' | cut -d= -f2)
          echo "baked RELEASE_COMMIT_SHA=$baked"
          if [ "$baked" != "${{ github.sha }}" ]; then
            echo "expected ${{ github.sha }}, got '$baked'" >&2
            exit 1
          fi

      - name: Start container and verify /health
        run: |
          set -euo pipefail
          container_id=$(docker run -d --network host \
            --env NODE_ENV=production \
            --env DATABASE_URL="$DATABASE_URL" \
            --env REDIS_URL="$REDIS_URL" \
            --env PORT=3001 \
            --env WEB_URL=http://127.0.0.1:3000 \
            --env UNAS_CREDENTIAL_ACTIVE_KEY_VERSION=1 \
            --env UNAS_CREDENTIAL_MASTER_KEY_V1="$(openssl rand -base64 32)" \
            --env UNAS_API_KEY=ci-smoke-test-key \
            acropora-api:ci)

          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if response=$(curl -sf http://127.0.0.1:3001/health); then
              echo "$response"
              echo "api container is healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done

          echo "api container never became healthy" >&2
          exit 1
