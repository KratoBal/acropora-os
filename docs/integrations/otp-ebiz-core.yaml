  parameters:
  
    Pageable:
      name: pageable
      in: query
      description: Pagination information.
      required: true
      schema:
        $ref: '#/components/schemas/Pageable'

    InvoiceId:
      name: invoiceId
      in: path
      description: Numeric ID of the invoice to be retrieved.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    InvoiceNumber:
      name: invoiceNumber
      in: path
      description: Sequence number of the invoice to be retrieved.
      required: true
      schema:
        $ref: '#/components/schemas/InvoiceNumber'
      
  responses:
  
    BadRequest:
      description: Bad request.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessageResponse"

    Unauthorized:
      description: The authorization token is missing or invalid.
      headers:
        RateLimit-Limit:
            $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
            $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
            $ref: '#/components/headers/RateLimit-Reset'
        RateLimit-Policy:
            $ref: '#/components/headers/RateLimit-Policy'
