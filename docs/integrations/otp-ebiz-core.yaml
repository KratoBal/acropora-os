    VatType:
      type: string
      description: | # The collection of VAT rates.
        *  - AFA_5 - 5%
        * - AFA_18 - 18%
        * - AFA_27 - 27%
        * - AAM - Alanyi adómentes
        * - TAM - Tárgyi adómentes
        * - ATK - ÁFA tárgyi hatályon kívüli
        * - KAFA_TRAVEL_AGENCY - Különbözeti ÁFA Utazási irodák
        * - KAFA_SECOND_HAND - Különbözeti ÁFA Használt cikkek
        * - KAFA_ARTWORK -  Különbözeti ÁFA Műalkotások
        * - KAFA_ANTIQUES  - Különbözeti ÁFA Gyűjteménydarabok és régiségek
        * - FAFA_DOMESTIC - Belföldi fordított adózás
        * - FAFA_EUFAD37 - EU-s teljesítés, Áfa tv. 37. § szerinti
        * - FAFA_EUFADE - EU-s teljesítés, nem Áfa tv. 37. § szerint
        * - KBAET - EU-n belüli termékértékesítés
        * - KBAUK - EU közlekedési eszk.
        * - EAM - EU-n kívüli termékexport
        * - NAM - Egyéb nemzetközi ügylet
        * - EUE - Másik tagállamban teljesített, nem fordítottan adózó ügylet
        * - HO - Harmadik országban teljesített ügylet      
      enum:
        - AFA_5
        - AFA_18
        - AFA_27
        - AAM
        - TAM
        - ATK
        - KAFA_TRAVEL_AGENCY
        - KAFA_SECOND_HAND
        - KAFA_ARTWORK
        - KAFA_ANTIQUES
